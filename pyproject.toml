[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "week1-micro-pipeline"
dynamic = ["version"]
requires-python = ">=3.10"
description = "LLM decision pipeline with validation, repair, scoring, grading, and reask."
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.110",
  "pydantic>=2",
  "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-requests"]
api = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]

[tool.setuptools]
packages = ["pipeline"]

[tool.setuptools.dynamic]
version = {attr = "pipeline.version.PIPELINE_VERSION"}

[tool.ruff]
exclude = ["scratch_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
